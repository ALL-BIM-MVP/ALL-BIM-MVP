# Preparación para pruebas en red — instalación de todo el stack en
# una máquina (ver docs/instalacion-cliente.md para la guía completa
# paso a paso). Dockeriza TODO: backend (Node) + processing (Python) +
# BD (Postgres) + frontend (build de producción, servido por nginx) —
# "docker compose up/down" prende y apaga la instalación entera.
#
# .env real en la RAÍZ del repo (junto a este archivo), copiado desde
# .env.example — docker-compose lo usa para sustituir ${DB_USER} etc.
# acá abajo Y para inyectárselo entero al contenedor "backend"
# (env_file).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # /var/lib/postgresql (SIN /data al final) — a propósito. Desde
      # postgres:18, la imagen oficial pasó a un layout compatible con
      # pg_ctlcluster y un mount en el punto viejo (.../data) hace que
      # el contenedor quede en loop de reinicio, "unhealthy" (visto en
      # la primera instalación real, ver
      # docs/diagnostico-primera-instalacion.md punto 2 — el propio log
      # de arranque de la imagen lo explica, y
      # https://github.com/docker-library/postgres/pull/1259 confirma
      # el cambio). Si alguna vez se vuelve a romper acá: primero mirar
      # si cambió otra vez el layout de la imagen antes de asumir que
      # es config nuestra.
      - db_data:/var/lib/postgresql
      # Prefijos numéricos a propósito: postgres corre los scripts de
      # /docker-entrypoint-initdb.d/ en orden alfabético, UNA sola vez
      # (solo si el volumen de datos está vacío) — schema.sql tiene
      # que ir antes que system-data.sql (crea las tablas que la
      # segunda llena). seed-test.sql NO se monta acá a propósito —
      # es dato de prueba de Ismael, no debe entrar en la máquina del
      # cliente.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/system-data.sql:/docker-entrypoint-initdb.d/02-system-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # No alcanza con "esperar a que el contenedor arranque" — la
        # primera vez que postgres corre los scripts de init, se
        # reinicia solo internamente después. Sin el healthcheck, el
        # backend podría conectarse en esa ventana y fallar.
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Fijo acá (no en .env) — correr por Docker Compose SIEMPRE es
      # una instalación real, no algo que el cliente deba configurar.
      # Usado por utils/logger.ts (mejoras-backend-post-auditoria.md,
      # punto 3) para bajar el nivel de log a 'info' — 'debug' (el
      # default fuera de Docker) generaría demasiado ruido en
      # `docker compose logs backend`.
      NODE_ENV: production
    ports:
      # Puerto del HOST configurable (BACKEND_HOST_PORT en el .env,
      # default 4000) — el puerto de ADENTRO del contenedor siempre es
      # 4000, eso no cambia. Por si en la máquina de destino el 4000 ya
      # lo usa otra cosa (ej. un backend nativo corriendo aparte).
      - "${BACKEND_HOST_PORT:-4000}:4000"
    volumes:
      # Volumen NOMBRADO (no bind-mount) a propósito: la primera vez
      # que se crea vacío, Docker copia automáticamente lo que ya
      # tenía la imagen en esa ruta — incluido
      # uploads/public/default/project-deafault.jpg (trackeado en git
      # desde este cambio, ver .gitignore), así la portada por defecto
      # aparece sola sin ningún script de arranque a medida.
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Queda GRABADO en el build (ver frontend/Dockerfile) — cambiar
        # esto implica "docker compose up -d --build frontend", no
        # alcanza con tocar el .env y reiniciar (a diferencia del
        # backend, que sí lee sus env vars en tiempo de ejecución).
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      # 5173 de default a propósito, NO 80 — así el túnel de Cloudflare
      # ya configurado (docs/instalacion-cliente.md, apunta a
      # "http://localhost:5173") sigue funcionando sin tocar su
      # config.yml al pasar el frontend de nativo a Docker.
      - "${FRONTEND_HOST_PORT:-5173}:80"

volumes:
  db_data:
  uploads_data:
