# Fallback de SPA — cualquier ruta que no sea un archivo real (todas
# las rutas de React Router: /dashboard/projects/5, /ayuda/colaboradores,
# etc.) tiene que devolver index.html, no un 404. React Router recién
# puede leer la URL y decidir qué pintar DESPUÉS de que el navegador
# recibió ese index.html — sin esto, F5 en cualquier ruta que no sea
# "/" rompe.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
